<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>X Bookmarks Feed</title>
  <style>
    body {
      width: 300px;
      margin: 0;
      padding: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #0f1419;
      background: #fff;
    }
    h2 {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .group {
      border: 1px solid #e6e6e6;
      border-radius: 12px;
      padding: 4px 12px 10px;
      margin-bottom: 12px;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0 0;
      font-size: 13px;
    }
    select {
      font: inherit;
      font-size: 13px;
      padding: 4px 8px;
      border: 1px solid #d0d0d0;
      border-radius: 8px;
      background: #fff;
      color: #0f1419;
    }
    .toggle {
      position: relative;
      display: inline-block;
      width: 40px;
      height: 22px;
      flex: 0 0 40px;
    }
    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      inset: 0;
      background: #c9c9c9;
      border-radius: 22px;
      transition: 0.2s;
      cursor: pointer;
    }
    .slider::before {
      content: "";
      position: absolute;
      height: 16px;
      width: 16px;
      left: 3px;
      bottom: 3px;
      background: #fff;
      border-radius: 50%;
      transition: 0.2s;
    }
    input:checked + .slider {
      background: #1d9bf0;
    }
    input:checked + .slider::before {
      transform: translateX(18px);
    }
    button {
      width: 100%;
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      padding: 8px 12px;
      border: none;
      border-radius: 8px;
      background: #1d9bf0;
      color: #fff;
      cursor: pointer;
    }
    button:hover {
      background: #1a8cd8;
    }
    button:disabled {
      opacity: 0.6;
      cursor: default;
    }
    .status {
      margin: 10px 0 0;
      font-size: 12px;
      line-height: 1.5;
      color: #536471;
      white-space: pre-line;
    }
    .status.error {
      color: #c0392b;
    }
    .status.ok {
      color: #157347;
    }
    .status.feed {
      margin-top: 4px;
      font-size: 11px;
    }
    .version {
      font-size: 10px;
      font-weight: 600;
      color: #8b98a5;
      margin-left: 4px;
    }
    .advanced {
      margin-top: 12px;
      font-size: 12px;
      color: #536471;
    }
    .advanced summary {
      cursor: pointer;
      font-weight: 600;
      color: #536471;
      outline: none;
    }
    .advanced[open] summary {
      margin-bottom: 6px;
    }
    .advanced input {
      width: 100%;
      box-sizing: border-box;
      margin-top: 4px;
      padding: 5px 7px;
      font: inherit;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
      border: 1px solid #d0d0d0;
      border-radius: 6px;
    }
    .debug {
      display: none;
      margin-top: 10px;
      padding: 9px;
      background: #f5f5f5;
      border-radius: 8px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 10.5px;
      white-space: pre-wrap;
      line-height: 1.5;
    }
    .support {
      margin-top: 14px;
      padding-top: 10px;
      border-top: 1px solid #eff3f4;
      font-size: 11px;
      line-height: 1.5;
      color: #8b98a5;
    }
    .support p {
      margin: 0 0 6px;
    }
    .donate {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 6px 8px;
      border: 1px solid #e6e6e6;
      border-radius: 8px;
      background: #f7f9f9;
      color: #0f1419;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 10.5px;
      font-weight: 500;
      line-height: 1.4;
      text-align: center;
      word-break: break-all;
      cursor: pointer;
    }
    .donate:hover {
      background: #eff3f4;
      border-color: #d0d0d0;
    }
  </style>
</head>
<body>
  <div class="header">
    <h2>X Bookmarks <span class="version" id="version"></span></h2>
    <label class="toggle">
      <input type="checkbox" id="extension-toggle">
      <span class="slider"></span>
    </label>
  </div>

  <div class="group">
    <div class="row">
      <span>Show bookmark rail</span>
      <label class="toggle">
        <input type="checkbox" id="rail-toggle" checked>
        <span class="slider"></span>
      </label>
    </div>
    <div class="row">
      <span>Mark bookmarked tweets</span>
      <label class="toggle">
        <input type="checkbox" id="indicator-toggle" checked>
        <span class="slider"></span>
      </label>
    </div>
    <div class="row">
      <span>Rail size</span>
      <select id="rail-size">
        <option value="compact">Compact</option>
        <option value="standard" selected>Standard</option>
        <option value="roomy">Roomy</option>
      </select>
    </div>
    <div class="row">
      <span>Sync every</span>
      <select id="frequency">
        <option value="high">1 hour</option>
        <option value="medium" selected>4 hours</option>
        <option value="low">12 hours</option>
      </select>
    </div>
    <div class="row">
      <span>Prioritize recent</span>
      <label class="toggle">
        <input type="checkbox" id="recent-toggle" checked>
        <span class="slider"></span>
      </label>
    </div>
    <div class="row">
      <span>Resurface in timeline</span>
      <label class="toggle">
        <input type="checkbox" id="inject-toggle" checked>
        <span class="slider"></span>
      </label>
    </div>
    <div class="row">
      <span>Every</span>
      <select id="inject-every">
        <option value="6">6 posts</option>
        <option value="10" selected>10 posts</option>
        <option value="20">20 posts</option>
      </select>
    </div>
    <div class="row">
      <span>Which bookmark</span>
      <select id="inject-mode">
        <option value="smart" selected>Related, else backlog</option>
        <option value="related">Only related</option>
        <option value="rotate">Next in backlog</option>
      </select>
    </div>
  </div>

  <button id="refresh-bookmarks">Refresh Bookmarks</button>
  <p class="status" id="status">Not loaded yet.</p>
  <p class="status feed" id="feed-status"></p>

  <details class="advanced">
    <summary>Advanced</summary>
    <label for="queryid">Query ID override (leave blank — auto-detected)</label>
    <input id="queryid" type="text" spellcheck="false" autocomplete="off">
    <button id="save-queryid" style="margin-top:6px; background:#536471;">Save</button>
    <button id="debug-toggle" style="margin-top:6px; background:#536471;">Debug Info</button>
  </details>
  <div class="debug" id="debug"></div>

  <div class="support">
    <p>Free. No account, no server, no tracking. If it earns a place in your feed:</p>
    <button id="donate" class="donate" title="Copy ETH address">0xe75fe7492D16dB9f133dA20De2F2a1AA68406977</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
