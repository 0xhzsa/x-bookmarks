<!-- popup.html -->
<!DOCTYPE html>
<html>
<head>
  <title>X Bookmarks Feed Integration</title>
  <link rel="stylesheet" type="text/css" href="styles.css">
  <style>
    body {
      width: 300px;
      font-family: Arial, sans-serif;
      padding: 10px;
    }
    .container {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header h2 {
      margin: 0;
      color: #1DA1F2;
    }
    .toggle-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .toggle {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 24px;
    }
    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      transition: .4s;
      border-radius: 24px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 4px;
      bottom: 4px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #1DA1F2;
    }
    input:checked + .slider:before {
      transform: translateX(26px);
    }
    .settings-group {
      border: 1px solid #eee;
      border-radius: 8px;
      padding: 10px;
    }
    button {
      background-color: #1DA1F2;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0c85d0;
    }
    .status {
      font-size: 12px;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h2>X Bookmarks Feed</h2>
      <div class="toggle-container">
        <label class="toggle">
          <input type="checkbox" id="extension-toggle">
          <span class="slider"></span>
        </label>
      </div>
    </div>
    
    <div class="settings-group">
      <div class="toggle-container">
        <span>Show bookmark indicator</span>
        <label class="toggle">
          <input type="checkbox" id="indicator-toggle" checked>
          <span class="slider"></span>
        </label>
      </div>
      
      <div class="toggle-container">
        <span>Bookmark frequency</span>
        <select id="frequency" style="font-family: 'Helvetica Neue', sans-serif; border: 1px solid #ccc; border-radius: 5px; padding: 10px; background-color: #fff; color: #333;">
          <option value="daily">Daily</option>
          <option value="weekly" selected>Weekly</option>
          <option value="monthly">Monthly</option>
        </select>
      </div>
      
      <div class="toggle-container">
        <span>Prioritize recent bookmarks</span>
        <label class="toggle">
          <input type="checkbox" id="recent-toggle" checked>
          <span class="slider"></span>
        </label>
      </div>
    </div>
    
    <button id="refresh-bookmarks">Refresh Bookmarks Cache</button>
    
    <p class="status">Last updated: <span id="last-updated">Never</span></p>
    <p class="status" id="bookmark-count">0 bookmarks loaded</p>
  </div>
  <script src="popup.js"></script>
</body>
</html>
